<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Mic → Gemini Answers</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36; --text: #e8eaf0;
    --muted: #8b93a7; --accent: #4f8cff; --rec: #ff4d5e; --ok: #2ecc71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .settings { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, select, textarea {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit;
  }
  input[type=password] { width: 230px; }
  button {
    border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }

  .mic-area { display: flex; flex-direction: column; align-items: center; margin: 36px 0 20px; }
  .mic {
    width: 110px; height: 110px; border-radius: 50%; background: var(--panel);
    border: 2px solid var(--border); display: grid; place-items: center; cursor: pointer;
    transition: all .2s; position: relative;
  }
  .mic svg { width: 46px; height: 46px; fill: var(--muted); transition: fill .2s; }
  .mic.on { border-color: var(--rec); background: #2a1519; }
  .mic.on svg { fill: var(--rec); }
  .mic.on::after {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    border: 2px solid var(--rec); animation: pulse 1.4s infinite; opacity: 0;
  }
  @keyframes pulse { 0% { transform: scale(.9); opacity: .8; } 100% { transform: scale(1.25); opacity: 0; } }
  .status { margin-top: 14px; color: var(--muted); font-size: 13px; min-height: 18px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #transcript { width: 100%; min-height: 110px; resize: vertical; border: none; background: transparent; padding: 0; font-size: 16px; line-height: 1.5; }
  #transcript:focus { outline: none; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }

  #answers .qa { border-top: 1px solid var(--border); padding: 14px 0; }
  #answers .qa:first-child { border-top: none; padding-top: 4px; }
  .q { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .a { font-size: 16px; line-height: 1.6; white-space: pre-wrap; }
  .a.loading { color: var(--muted); }
  .a.err { color: var(--rec); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  @media (max-width: 600px) {
    .wrap { padding: 16px 12px 40px; }
    header { flex-direction: column; align-items: stretch; }
    .settings { flex-direction: column; align-items: stretch; }
    input[type=password], select { width: 100%; font-size: 16px; padding: 12px; }
    .mic { width: 130px; height: 130px; }
    .mic-area { margin: 24px 0 12px; }
    #transcript { font-size: 17px; }
    .actions button { width: 100%; padding: 16px; font-size: 17px; }
    .hint { display: none; }
  }
  kbd { background: #222733; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎙️ Live Mic → Gemini</h1>
    <div class="settings">
      <input id="apiKey" type="password" placeholder="Paste Gemini API key" />
      <select id="model">
        <option value="gemini-3.8-flash">gemini-3.8-flash</option>
      </select>
      <select id="lang">
        <option value="en-US">English (US)</option>
        <option value="en-IN">English (India)</option>
        <option value="en-GB">English (UK)</option>
        <option value="hi-IN">Hindi</option>
      </select>
    </div>
  </header>

  <div class="mic-area">
    <div id="mic" class="mic" title="Start / stop listening">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </div>
    <div id="status" class="status">Click the mic to start listening</div>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="label">Live transcript</span>
      <button id="clearBtn" class="btn-ghost">Clear</button>
    </div>
    <textarea id="transcript" placeholder="Your speech will appear here live… (you can also type or edit)"></textarea>
    <div class="actions">
      <button id="sendBtn" class="btn-primary">Send ➤</button>
    </div>
    <div class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to send · Mic keeps listening after you send · Transcript clears after each send</div>
  </div>

  <div class="card">
    <div class="card-head"><span class="label">Answers</span><button id="newBtn" class="btn-ghost">New session</button></div>
    <div id="answers"><div class="q">Answers will show up here.</div></div>
  </div>
</div>

<script>
  // ---------- Settings (saved locally in your browser) ----------
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  $('apiKey').value = store.get('gemini_key') || '';
  const DEFAULT_MODEL = 'gemini-3.8-flash';
  let savedModel = store.get('gemini_model');
  if (!savedModel || /^gemini-(1|2)\./.test(savedModel)) savedModel = DEFAULT_MODEL; // old models retired
  $('model').value = savedModel;
  $('lang').value = store.get('speech_lang') || 'en-US';
  $('apiKey').addEventListener('change', e => { store.set('gemini_key', e.target.value.trim()); loadModels(); });

  // Fetch the models your key can actually use, so retired models never break the app
  async function loadModels() {
    const key = $('apiKey').value.trim();
    if (!key) return;
    try {
      const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: { 'x-goog-api-key': key } });
      if (!res.ok) return;
      const data = await res.json();
      const names = (data.models || [])
        .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
        .map(m => m.name.replace('models/', ''))
        .filter(n => n.startsWith('gemini') && !/embed|tts|image|audio|live|vision|robotics|computer/i.test(n))
        .sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
      if (!names.length) return;
      const sel = $('model');
      const current = sel.value;
      sel.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
      sel.value = names.includes(current) ? current
        : (names.find(n => /flash$/.test(n) && !/lite/.test(n)) || names.find(n => /flash/.test(n)) || names[0]);
      store.set('gemini_model', sel.value);
    } catch {}
  }
  loadModels();
  $('model').addEventListener('change', e => store.set('gemini_model', e.target.value));
  $('lang').addEventListener('change', e => {
    store.set('speech_lang', e.target.value);
    if (listening) { recognition.stop(); } // auto-restarts with new language
  });

  // ---------- Speech recognition (continuous + live) ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let committed = '';       // settled words
  let currentInterim = '';  // words still being recognized (shown live)
  function renderTranscript() {
    const t = $('transcript');
    t.value = (committed + (currentInterim ? ' ' + currentInterim : '')).trim();
    t.scrollTop = t.scrollHeight;
  }
  // if you type/edit in the box, keep your edits
  $('transcript').addEventListener('input', () => { committed = $('transcript').value; currentInterim = ''; });
  let recognition = null;
  let listening = false;

  if (!SR) {
    $('status').textContent = '⚠️ Live speech recognition needs Google Chrome or Microsoft Edge.';
    $('mic').style.opacity = .4;
  } else {
    recognition = new SR();
    // Android/iOS duplicate words in continuous mode, so on phones we use short
    // sessions that auto-restart (still feels continuous).
    const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    recognition.continuous = !IS_MOBILE;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const text = event.results[i][0].transcript.trim();
        if (!text) continue;
        if (event.results[i].isFinal) {
          committed = (committed + ' ' + text).trim();
        } else {
          interim += ' ' + text;
        }
      }
      currentInterim = interim.trim();
      renderTranscript();
    };

    recognition.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        listening = false;
        setMicUI();
        $('status').textContent = '⚠️ Microphone permission denied. Allow mic access in the address bar.';
      } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
        $('status').textContent = 'Speech error: ' + e.error + ' (retrying…)';
      }
    };

    // Chrome stops after silence / ~60s — restart automatically so it's truly continuous
    recognition.onend = () => {
      // keep any half-finished words instead of losing them on restart
      if (currentInterim) { committed = (committed + ' ' + currentInterim).trim(); currentInterim = ''; renderTranscript(); }
      if (listening) {
        setTimeout(() => { try { recognition.lang = $('lang').value; recognition.start(); } catch {} }, 150);
      }
    };
  }

  function setMicUI() {
    $('mic').classList.toggle('on', listening);
    $('status').textContent = listening ? '● Listening… speak freely' : 'Click the mic to start listening';
  }

  $('mic').addEventListener('click', () => {
    if (!recognition) return;
    listening = !listening;
    if (listening) {
      recognition.lang = $('lang').value;
      try { recognition.start(); } catch {}
    } else {
      recognition.stop();
    }
    setMicUI();
  });

  $('clearBtn').addEventListener('click', () => { committed = ''; currentInterim = ''; renderTranscript(); });

  // ---------- Gemini ----------
  const SYSTEM_PROMPT = `You are answering questions as a confident, knowledgeable candidate in a conversation (like an interview or a viva).
Rules:
- Give ONLY the answer. No preamble like "Great question" or "Sure".
- Speak in first person, natural and confident, as if saying it out loud.
- Keep it short: 3–6 sentences, or a few tight bullet points if listing things.
- Lead with the direct answer, then one supporting detail or example.
- For technical questions, be precise; include a tiny example if it helps.
- The input is raw speech-to-text, so ignore filler words and fix obvious transcription mistakes.
- If several questions are in the input, answer each briefly in order.
- This is one continuous conversation: use earlier questions and your earlier answers for context, stay consistent with what you already said, and treat follow-ups like "why?" or "give an example" as referring to the previous topic.`;

  // Conversation memory: previous Q&A are sent along so follow-ups connect
  let history = [];
  const MAX_TURNS = 12;

  async function askGemini(question) {
    const key = $('apiKey').value.trim();
    if (!key) throw new Error('Please paste your Gemini API key at the top first.');
    const model = $('model').value;
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: [...history, { role: 'user', parts: [{ text: question }] }],
        generationConfig: { temperature: 0.6, maxOutputTokens: 800 }
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data?.error?.message || ('HTTP ' + res.status));
    const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('').trim();
    if (!text) throw new Error('No answer returned (it may have been blocked).');
    history.push({ role: 'user', parts: [{ text: question }] }, { role: 'model', parts: [{ text }] });
    if (history.length > MAX_TURNS * 2) history = history.slice(-MAX_TURNS * 2);
    return text;
  }

  async function send() {
    // include any words still being recognized
    const question = $('transcript').value.trim();
    if (!question) { $('status').textContent = 'Nothing to send yet — say something first.'; return; }

    // clear transcript right away so the next question starts fresh (mic keeps running)
    committed = ''; currentInterim = ''; renderTranscript();

    const answers = $('answers');
    if (answers.querySelector('.q') && !answers.querySelector('.qa')) answers.innerHTML = '';
    const block = document.createElement('div');
    block.className = 'qa';
    block.innerHTML = `<div class="q"></div><div class="a loading">Thinking…</div>`;
    block.querySelector('.q').textContent = 'Q: ' + question;
    answers.prepend(block); // newest on top

    const aEl = block.querySelector('.a');
    try {
      aEl.textContent = await askGemini(question);
      aEl.classList.remove('loading');
    } catch (err) {
      aEl.textContent = '⚠️ ' + err.message;
      if (/no longer available|not found|not supported/i.test(err.message)) {
        loadModels(); aEl.textContent += '\n\n↻ Model list refreshed — tap Send again.';
      }
      aEl.classList.remove('loading');
      aEl.classList.add('err');
    }
  }

  $('sendBtn').addEventListener('click', send);
  $('newBtn').addEventListener('click', () => {
    history = [];
    $('answers').innerHTML = '<div class="q">New session started — previous answers forgotten.</div>';
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); send(); }
  });
</script>
</body>
</html>
